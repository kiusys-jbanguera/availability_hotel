# Unico control automatico de la fase 1 (HU-S01 RF-07). Los hooks usan las
# versiones fijadas en uv.lock via `uv run`, sin descargar repos externos.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --frozen black --check
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]
