[project]
name = "availability-hotel"
version = "0.1.0"
description = "API REST que consulta disponibilidad y tarifas de multiples proveedores hoteleros en paralelo"
authors = [
    { name = "jbanguera", email = "jbanguera@kiusys.com" }
]
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "boto3==1.43.115",
    "fastapi==0.153.0",
    "niquests==3.21.2",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black==26.10.1",
    "httpx2==2.15.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.black]

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "slow: pruebas que miden tiempos reales (presupuesto de 2 s)",
]

[tool.coverage.run]
source = ["availability_hotel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
